name: macos-lab

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "Open an upterm ssh session on the mac"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lab:
    name: lab (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      # Detached so the connection string can be published as an artifact
      # below; the post step then keeps the job alive while the session
      # is in use.
      - name: ssh session
        if: inputs.ssh
        id: upterm
        uses: owenthereal/action-upterm@v1
        env:
          TMPDIR: /tmp
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 30
          detached: true

      # Lets the connection string be fetched with gh while the job runs,
      # instead of digging through live web logs. Files produced during
      # the session come back over scp, no closing artifact needed.
      - name: Publish ssh command
        if: inputs.ssh
        run: printf '%s\n' "${{ steps.upterm.outputs.ssh-command }}" | tee ssh-command.txt

      - uses: actions/upload-artifact@v7
        if: inputs.ssh
        with:
          name: ssh-command
          path: ssh-command.txt
          retention-days: 1
