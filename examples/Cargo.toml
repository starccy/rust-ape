[workspace]

[package]
name = "rust-ape-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ape = { path = "../crates/ape" }
# host_layout: the test library declared like a -sys crate
lp-sys = { path = "lp-sys" }
# host_com. The windows-* crates are compiled as Windows code by the rustc
# wrapper, see xtask/src/host/rustcwrap/.
windows = { version = "0.62", features = [
    "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation",
    # host_gui
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader",
    "Win32_System_Console",
] }
windows-core = "0.62"
# host_gui: the Linux window and its frames, unmodified; X11 and Wayland
# are reached through libloading's dlopen
winit = "0.30"
softbuffer = "0.4"
# Pulls in async-io, async-process and polling
smol = "2"
# Pulls in getrandom.
rand = "0.10.2"
tempfile = "3.27.0"
# errno_codes compares raw_os_error against these constants; resolves to the
# cosmo-adapted copy through [patch.crates-io] like everything else.
libc = "0.2"
sha2 = "0.11.0"
blake3 = "1.8.6"
md-5 = "0.11.0"
ureq = { version = "3.4.0", features = ["platform-verifier"] }
rustls-native-certs = "0.8"
# Carries crossterm, whose default event source is mio. tui_demo reaches it
# through ratatui::crossterm rather than a direct dependency, so there is one
# crossterm in the tree and it is the mio one. This used to be pinned to
# `use-dev-tty` to stay off mio; shim/epoll.c is what made that unnecessary.
ratatui = "0.30.2"
# file_watch. notify picks its backend off the target triple, so it reaches for
# inotify on every host and lands on shim/inotify.c.
notify = "8"
# pty. Its unix path wants TIOCSCTTY from the child between fork and exec,
# which shim/termios.c answers.
portable-pty = "0.9"
# parking_lot parks via raw syscall(SYS_futex) — the __ape_shim_syscall path.
parking_lot = "0.12"
# safe wrapper for if_name_index
nix = { version = "0.31", features = ["net"] }
# tokio reaches the IO driver through mio, which picks epoll on a linux target
# and gets it from shim/epoll.c. These examples are the only thing exercising
# that shim through a real runtime rather than the probe.
tokio = { version = "1", features = ["full"] }
# tokio_codec only.
tokio-util = { version = "0.7", features = ["full"] }
futures-util = { version = "0.3", features = ["sink"] }
# reqwest_client, on rustls with the ring backend, which uses the AES and SHA
# instructions on arm64 where aws-lc-rs here doesn't. reqwest's defaults
# build too.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json", "charset", "http2", "query", "form", "multipart", "stream",
    "cookies", "gzip", "brotli", "deflate", "zstd", "blocking", "socks",
    "hickory-dns", "system-proxy", "rustls-no-provider" ] }
rustls = { version = "0.23", default-features = false, features = [
    "ring", "std", "tls12", "logging" ] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
# reqwest's zstd feature reaches zstd-sys. Named only to turn `no_asm` on
# through feature unification, which picks the same C path its __linux__
# guarded assembly leaves anyway.
zstd-sys = { version = "2", features = ["no_asm"] }
# local_time. chrono's Local reads TZ and /etc/localtime and parses the TZif
# itself; there is no way to compile a database in, which is exactly the gap
# the example measures.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# local_time. tzdb-bundle-always compiles the IANA database into the binary,
# which is what makes a zone name resolvable on a host that ships no tzdata.
# The default tzdb-bundle-platform bundles by target_os, and this target says
# linux, so it would leave Windows with nothing.
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
zip = { version = "8.6.0", default-features = false }
# proc_sysinfo. Its linux backend reads /proc and /sys, which is what
# shim/procfs/ emulates on other platforms. The example is that emulation's
# acceptance test in-tree.
sysinfo = "0.39"
# host_link. Without the bundled feature it links the system's libsqlite3,
# which the build can only find as a shared object, so the linker wrapper
# swaps it for stubs that load the host's copy at runtime.
libsqlite3-sys = "0.35"
# jemalloc_churn. The allocator ripgrep uses on this target.
tikv-jemallocator = "0.7"
# mimalloc_churn. The allocator ruff and biome use on Windows, C built by cc.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

# host_link: SQLite comes with Windows 10 and later under this name
[package.metadata.rust-ape.host-libs]
sqlite3 = { windows = ["winsqlite3.dll", "sqlite3.dll"] }
# host_layout: the test library once more, declared by lp-sys the way a
# -sys crate does; the builds are in the zip store, see bundle.toml
lp = { linux = ["/usr/lib/rust-ape-layout-test/liblp-x86_64.so", "/usr/lib/rust-ape-layout-test/liblp-aarch64.so"], macos = ["/usr/lib/rust-ape-layout-test/liblp.dylib"], windows = ["/usr/lib/rust-ape-layout-test/lp.dll"] }

[patch.crates-io]
libc = { path = "../vendor/patches/libc" }
