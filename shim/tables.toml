# getauxval() keys. cosmo synthesizes the auxv on non-Linux hosts and its
# AT_* keys are runtime constants, so a Linux-coded key has to be mapped
# before the lookup. AT_MINSIGSTKSZ is the one std actually reads (it sizes
# sigaltstack with it); the HWCAP pair rides along for feature detection.
[[table]]
macro = "SHIM_AUXV_TABLE"
header = "sysv/consts/auxv.h"
ctype = "unsigned long"
names = [
    "AT_MINSIGSTKSZ", "AT_HWCAP", "AT_HWCAP2",
]

# Address families. UNSPEC/UNIX/INET are universal (cosmo #defines them);
# AF_INET6 is the runtime one, and it also lives inside sockaddr_in6's
# family field, which the socket shim rewrites in both directions.
[[table]]
macro = "SHIM_AF_TABLE"
header = "sysv/consts/af.h"
ctype = "int"
names = [
    "AF_UNSPEC", "AF_UNIX", "AF_INET", "AF_INET6",
    # The rest mostly exist on Linux alone. They are listed so that a Linux
    # number isn't read as whatever family owns it on the host (16 is
    # AF_NETLINK on Linux and AF_APPLETALK on XNU and NT). AF_ROUTE is left
    # out: on Linux it is AF_NETLINK, on XNU a different protocol. So is
    # AF_PACKET, which shim/packet.c emulates on NT under its Linux number.
    "AF_NETLINK", "AF_VSOCK", "AF_APPLETALK",
    "AF_ASH", "AF_IPX", "AF_IRDA", "AF_ISDN", "AF_MPLS",
    "AF_NETROM", "AF_PHONET", "AF_ROSE", "AF_SNA", "AF_TIPC",
    "AF_ALG", "AF_ATMPVC", "AF_ATMSVC", "AF_AX25",
    "AF_BLUETOOTH", "AF_BRIDGE", "AF_CAIF", "AF_CAN",
    "AF_ECONET", "AF_IB", "AF_IEEE802154", "AF_IUCV",
    "AF_KEY", "AF_LLC", "AF_NETBEUI", "AF_NFC", "AF_PPPOX",
    "AF_RXRPC", "AF_SECURITY", "AF_WANPIPE", "AF_X25",
]

# termios flag bits, one domain per c_*flag field. The C side translates
# bit by bit and silently drops what the host lacks — kernels ignore
# unknown termios bits, so strictness here would only break raw-mode setup.
[[table]]
macro = "SHIM_TIFLAG_TABLE"
header = "sysv/consts/termios.h"
ctype = "uint32_t"
names = [
    "IGNBRK", "BRKINT", "IGNPAR", "PARMRK", "INPCK",
    "ISTRIP", "INLCR", "IGNCR", "ICRNL", "IUCLC",
    "IXON", "IXANY", "IXOFF", "IMAXBEL", "IUTF8",
]

[[table]]
macro = "SHIM_TOFLAG_TABLE"
header = "sysv/consts/termios.h"
ctype = "uint32_t"
names = [
    "OPOST", "OLCUC", "ONLCR", "OCRNL", "ONOCR",
    "ONLRET", "OFILL", "OFDEL",
]

