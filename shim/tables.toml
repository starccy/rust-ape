header = "sysv/consts/termios.h"
ctype = "uint8_t"
names = [
    "VINTR", "VQUIT", "VERASE", "VKILL", "VEOF",
    "VTIME", "VMIN", "VSWTC", "VSTART", "VSTOP",
    "VSUSP", "VEOL", "VREPRINT", "VDISCARD",
