# Baud codes: enumerated values living in musl's CBAUD field of c_cflag and
# in cosmo's _c_ispeed/_c_ospeed. B460800/B921600 exist in musl but not in
# cosmo, so they are simply not mapped (unmatched rates pass unset).
[[table]]
macro = "SHIM_BAUD_TABLE"
header = "sysv/consts/baud.internal.h"
ctype = "uint32_t"
names = [
    "B0", "B50", "B75", "B110", "B134", "B150",
    "B200", "B300", "B600", "B1200", "B1800",
    "B2400", "B4800", "B9600", "B19200", "B38400",
    "B57600", "B115200", "B230400", "B500000",
    "B576000", "B1000000", "B1152000", "B1500000",
    "B2000000", "B2500000", "B3000000", "B3500000",
    "B4000000",
]

[[table]]
macro = "SHIM_TCFLUSH_TABLE"
header = "sysv/consts/termios.h"
ctype = "int"
names = [
    "TCIFLUSH", "TCOFLUSH", "TCIOFLUSH",
