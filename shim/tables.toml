# What `cargo xtask gen-shim` puts into tables.h: the constants the shim
# translates between Linux's values (what the Rust side was compiled with)
# and cosmo's. After editing, run `cargo xtask gen-shim`.

# Linux values the shim handles one by one. They come out as bare
# SHIM_LIN_<name> defines, with no cosmo-side table.
singles = [
    "O_LARGEFILE", "O_SYNC", "O_DIRECTORY", "O_TMPFILE",
    "AT_FDCWD", "AT_SYMLINK_NOFOLLOW", "AT_REMOVEDIR", "AT_SYMLINK_FOLLOW",
    "AT_EMPTY_PATH", "AT_EACCESS", "AT_NO_AUTOMOUNT",
    # access/faccessat amode bits. POSIX numbers these 4/2/1 and every Unix
    # agrees, but cosmo publishes NT's access mask for them on Windows, so
    # they need translating like any other constant. F_OK is 0 everywhere,
    # which an empty translated mask reproduces on its own.
    "R_OK", "W_OK", "X_OK",
    "UTIME_NOW", "UTIME_OMIT",
    "LOCK_SH", "LOCK_EX", "LOCK_NB", "LOCK_UN",
    "SEEK_DATA", "SEEK_HOLE",
    "MS_ASYNC", "MS_INVALIDATE", "MS_SYNC",
    "RUSAGE_THREAD",
    # musl and cosmo number the mutex types and the pshared values
    # differently, as plain #defines on both sides
    "PTHREAD_MUTEX_NORMAL", "PTHREAD_MUTEX_RECURSIVE", "PTHREAD_MUTEX_ERRORCHECK",
    "PTHREAD_PROCESS_PRIVATE", "PTHREAD_PROCESS_SHARED",
    "SCHED_RESET_ON_FORK",
    "POSIX_SPAWN_RESETIDS", "POSIX_SPAWN_SETPGROUP", "POSIX_SPAWN_SETSIGDEF",
    "POSIX_SPAWN_SETSIGMASK", "POSIX_SPAWN_SETSCHEDPARAM", "POSIX_SPAWN_SETSCHEDULER",
    "POSIX_SPAWN_USEVFORK", "POSIX_SPAWN_SETSID",
    "WNOHANG", "WUNTRACED", "WCONTINUED",
    # waitid: idtypes, the extra option bits and the si_code values it
    # reports; the shim builds these by hand off Linux and passes them
    # straight to the kernel there.
    "WEXITED", "WSTOPPED", "WNOWAIT", "SYS_waitid",
    "P_ALL", "P_PID", "P_PGID", "P_PIDFD",
    "CLD_EXITED", "CLD_KILLED", "CLD_DUMPED", "CLD_TRAPPED", "CLD_STOPPED",
    "CLD_CONTINUED",
    "SOCK_CLOEXEC", "SOCK_NONBLOCK", "MAP_STACK",
    "SIG_BLOCK", "SIG_UNBLOCK", "SIG_SETMASK", "SO_ERROR",
    "SOL_SOCKET", "IPPROTO_IP", "IPPROTO_TCP", "IPPROTO_IPV6", "IPPROTO_UDP",
    "F_GETLK", "F_SETLK", "F_SETLKW", "F_SETOWN", "F_GETOWN",
    "F_DUPFD_CLOEXEC",
    # tty-config ioctl requests the shim reroutes to tcgetattr/tcsetattr
    # (kernel ABI numbers; on musl Ioctl is c_int so the *2 family is
    # negative), plus the musl-side baud fields of c_cflag.
    "TCGETS", "TCSETS", "TCSETSW", "TCSETSF",
    # FIONBIO and the FIOCLEX pair are rerouted through fcntl, so only
    # their Linux values are needed.
    "FIONBIO", "FIOCLEX", "FIONCLEX",
    "TCGETS2", "TCSETS2", "TCSETSW2", "TCSETSF2",
    "BOTHER", "CBAUD", "CBAUDEX",
    # Job-control ioctl requests the shim reroutes to tcgetpgrp/tcsetpgrp/
    # tcgetsid; cosmo publishes no constant for the first and last of them.
    "TIOCGPGRP", "TIOCSPGRP", "TIOCGSID",
    # raw syscall rerouting: futex (std's parker, parking_lot & friends)
    # and getrandom (the getrandom crate's syscall path)
    "SYS_futex", "FUTEX_WAIT", "FUTEX_WAKE", "FUTEX_PRIVATE_FLAG",
    "FUTEX_CLOCK_REALTIME", "FUTEX_WAIT_BITSET", "FUTEX_WAKE_BITSET",
    "FUTEX_BITSET_MATCH_ANY", "SYS_getrandom",
]

# One [[table]] per X-macro. `header` is where cosmo declares the names
# (under libc/), `ctype` the C type of cosmo's constants. A table with a
# `droppable` list gets a third column: those bits are hints, and a host
# that lacks one drops it instead of failing the call.
#
# A family cosmo already gives Linux's values at compile time needs no
# table. `cargo xtask audit` says which those are (errno, O_*, signal
# numbers, RLIMIT_* and MADV_* as of the rust-ape fork).

[[table]]
macro = "SHIM_FCNTL_CMD_TABLE"
header = "sysv/consts/f.h"
ctype = "int"
names = [
    "F_GETLK", "F_SETLK", "F_SETLKW",
    "F_SETOWN", "F_GETOWN", "F_DUPFD_CLOEXEC",
]

# struct flock l_type values. The struct layouts agree (layouts.c pins
# them), but these three are runtime constants on the cosmo side.
[[table]]
macro = "SHIM_LOCKTYPE_TABLE"
header = "sysv/consts/f.h"
