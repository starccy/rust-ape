# ioctl request codes forwarded to cosmo's ioctl (struct winsize has the
# same shape on both sides). The tty-config requests (TCGETS family) are
# deliberately NOT here: the ioctl shim reroutes them through
# tcgetattr/tcsetattr, so their Linux values live in SINGLES instead.
[[table]]
macro = "SHIM_TIOC_TABLE"
header = "sysv/consts/termios.h"
ctype = "uint64_t"
names = [
    "TIOCGWINSZ", "TIOCSWINSZ",
    # Session control, which is what a pty child does between fork and exec.
    "TIOCSCTTY", "TIOCNOTTY",
    # forwarded as they are: the argument is an int or a pointer to one
    "TIOCNXCL", "TIOCOUTQ", "TIOCGETD", "TIOCSETD",
    "TIOCSTI", "TIOCCONS", "TIOCSIG",
]

# Modem control lines, int* on both sides.
[[table]]
macro = "SHIM_MODEM_TABLE"
header = "sysv/consts/modem.h"
ctype = "uint64_t"
names = [
    "TIOCMGET", "TIOCMSET", "TIOCMBIS", "TIOCMBIC",
]

# statvfs f_flag bits, which cosmo hands over as the host spells them
